<!-- Trusted local shell. Rust substitutes the stylesheet and scripts below.
     Keep remote pages in the separate browser WebView: this document owns native IPC.
     CSP allows bundled inline code/styles and PNG data URLs, with no remote resources. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>GPT File Browser</title>
<style>
/*STYLES*/
</style>
</head>
<body>
<!-- Icon sprite: 16px outline glyphs drawn with the current text color. -->
<svg hidden aria-hidden="true">
  <symbol id="i-files" viewBox="0 0 16 16"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h2.8l1.5 1.6h4.7A1.5 1.5 0 0 1 14 6.1v5.4a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 16 16"><path d="M2.8 4.5h10.4M6.4 4.5V3h3.2v1.5M4.2 4.5l.5 7.9a1.2 1.2 0 0 0 1.2 1.1h4.2a1.2 1.2 0 0 0 1.2-1.1l.5-7.9M6.7 7.2v3.6M9.3 7.2v3.6"/></symbol>
  <symbol id="i-globe" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.8"/><path d="M2.2 8h11.6M8 2.2c2.1 2.2 2.1 9.4 0 11.6M8 2.2c-2.1 2.2-2.1 9.4 0 11.6"/></symbol>
  <symbol id="i-pulse" viewBox="0 0 16 16"><path d="M1.8 8.4h2.7l1.6-4.2 3 7.6 1.6-3.4h3.5"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.3"/><path d="m10.2 10.2 3.3 3.3"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 16 16"><path d="M13.2 8a5.2 5.2 0 1 1-1.6-3.7M13.3 2.6v2.8h-2.8"/></symbol>
  <symbol id="i-export" viewBox="0 0 16 16"><path d="M8 2.5v7.6M5 7.3l3 3 3-3M3 13.2h10"/></symbol>
  <symbol id="i-prev" viewBox="0 0 16 16"><path d="M9.6 3.6 5.2 8l4.4 4.4"/></symbol>
  <symbol id="i-next" viewBox="0 0 16 16"><path d="M6.4 3.6 10.8 8l-4.4 4.4"/></symbol>
  <symbol id="i-sort" viewBox="0 0 16 16"><path d="M4.6 6.4 8 9.8l3.4-3.4"/></symbol>
  <symbol id="i-stop" viewBox="0 0 16 16"><rect x="4.5" y="4.5" width="7" height="7" rx="1.2"/></symbol>
  <symbol id="i-home" viewBox="0 0 16 16"><path d="M2.6 7.4 8 2.9l5.4 4.5V13h-3.5V9.4H6.1V13H2.6z"/></symbol>
  <symbol id="i-library" viewBox="0 0 16 16"><path d="M2.8 2.8h4v4h-4zM9.2 2.8h4v4h-4zM2.8 9.2h4v4h-4zM9.2 9.2h4v4h-4z"/></symbol>
  <symbol id="i-alert" viewBox="0 0 16 16"><path d="M8 2.6 14 13H2zM8 6.6v3M8 11.3v.1"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path d="m3.4 8.4 3 3 6.2-6.4"/></symbol>
  <symbol id="i-restore" viewBox="0 0 16 16"><path d="M3.4 6.4h6.1a3.5 3.5 0 0 1 0 7H6.2M5.9 3.9 3.4 6.4l2.5 2.5"/></symbol>
  <symbol id="i-close" viewBox="0 0 16 16"><path d="m4.2 4.2 7.6 7.6M11.8 4.2l-7.6 7.6"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 16 16"><path d="M6.2 4.4 9.8 8l-3.6 3.6"/></symbol>
  <symbol id="k-image" viewBox="0 0 16 16"><rect x="2.4" y="3" width="11.2" height="10" rx="1.6"/><circle cx="5.9" cy="6.4" r="1"/><path d="m2.8 11.4 3.1-2.9 2.3 2.1 1.9-1.7 3 2.7"/></symbol>
  <symbol id="k-document" viewBox="0 0 16 16"><path d="M4.4 2.4h4.7l3 3v7.2a1 1 0 0 1-1 1H4.4a1 1 0 0 1-1-1V3.4a1 1 0 0 1 1-1z"/><path d="M9 2.6v2.9h2.9M5.8 8.4h4.4M5.8 10.7h4.4"/></symbol>
  <symbol id="k-sheet" viewBox="0 0 16 16"><rect x="2.4" y="3" width="11.2" height="10" rx="1.6"/><path d="M2.6 6.4h10.8M2.6 9.7h10.8M6.4 6.5v6.4"/></symbol>
  <symbol id="k-archive" viewBox="0 0 16 16"><path d="M2.7 5.3 8 2.7l5.3 2.6v5.4L8 13.3l-5.3-2.6z"/><path d="M2.9 5.4 8 7.9l5.1-2.5M8 7.9v5.2"/></symbol>
  <symbol id="k-video" viewBox="0 0 16 16"><rect x="2.4" y="3.4" width="11.2" height="9.2" rx="1.6"/><path d="M6.9 6.2v3.6L10 8z"/></symbol>
  <symbol id="k-audio" viewBox="0 0 16 16"><path d="M6.4 11.4V4.2l5.2-1.3v7.1"/><circle cx="4.9" cy="11.4" r="1.5"/><circle cx="10.1" cy="10" r="1.5"/></symbol>
  <symbol id="k-other" viewBox="0 0 16 16"><path d="M4.4 2.4h4.7l3 3v7.2a1 1 0 0 1-1 1H4.4a1 1 0 0 1-1-1V3.4a1 1 0 0 1 1-1z"/><path d="M9 2.6v2.9h2.9"/></symbol>
</svg>

<nav id="sidebar" aria-label="Sections">
  <div class="nav-title">Library</div>
  <button type="button" class="nav-item active" id="nav-files"><svg class="icon"><use href="#i-files"/></svg><span>All files</span><span class="nav-count" id="count-files"></span></button>
  <button type="button" class="nav-item" id="nav-trash"><svg class="icon"><use href="#i-trash"/></svg><span>Trash</span><span class="nav-count" id="count-trash"></span></button>
  <div class="nav-title">ChatGPT</div>
  <button type="button" class="nav-item" id="nav-browser"><svg class="icon"><use href="#i-globe"/></svg><span>Browser</span></button>
  <button type="button" class="nav-item" id="nav-evidence"><svg class="icon"><use href="#i-pulse"/></svg><span>Diagnostics</span><span class="nav-count" id="count"></span></button>
  <div class="nav-spacer"></div>
  <div id="usage" hidden>
    <div class="usage-row"><span>Storage</span><span id="usage-percent"></span></div>
    <div class="meter"><span id="usage-bar"></span></div>
    <div id="usage-text"></div>
  </div>
  <div id="status" role="status">Ready. Scan to connect to your Library.</div>
</nav>

<main>
  <section id="inventory" class="active" aria-labelledby="view-title">
    <header class="bar">
      <div class="title"><h1 id="view-title">All files</h1><span id="view-meta" class="meta"></span></div>
      <span class="grow"></span>
      <button type="button" class="btn quiet" id="exportcsv" disabled><svg class="icon"><use href="#i-export"/></svg>Export CSV</button>
      <button type="button" class="btn" id="cancelscan" hidden><svg class="icon"><use href="#i-stop"/></svg>Stop</button>
      <button type="button" class="btn" id="scanall"><svg class="icon"><use href="#i-refresh"/></svg><span id="scanlabel">Scan all files</span></button>
    </header>
    <div class="filters">
      <label class="search"><svg class="icon"><use href="#i-search"/></svg><input id="findfiles" type="search" placeholder="Search file names" aria-label="Search file names" title="Search file names (Ctrl+F)" autocomplete="off" spellcheck="false"></label>
      <select id="typefilter" aria-label="File type">
        <option value="all">All types</option>
        <option value="image">Images</option>
        <option value="document">Documents</option>
        <option value="archive">Archives</option>
        <option value="other">Other</option>
      </select>
      <select id="folderfilter" aria-label="Folder"><option value="">All folders</option></select>
    </div>
    <div id="notice" class="notice" role="status" hidden><svg class="icon"><use href="#i-alert"/></svg><span id="notice-text"></span></div>
    <div id="job" class="job" hidden>
      <div class="job-head">
        <span class="job-mark" id="job-mark"></span>
        <span id="job-text"></span>
        <span class="grow"></span>
        <button type="button" class="btn small" id="job-stop">Stop</button>
        <button type="button" class="btn small quiet" id="job-toggle" aria-expanded="false" aria-controls="job-list">Details<svg class="icon"><use href="#i-chevron"/></svg></button>
        <button type="button" class="btn small quiet square" id="job-dismiss" aria-label="Dismiss results" title="Dismiss results"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <div class="progress"><span id="job-bar"></span></div>
      <div id="job-list" class="job-list" hidden></div>
    </div>
    <div id="activity" class="activity" hidden><span></span></div>
    <div id="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="pick"><input type="checkbox" id="selectfiltered" aria-label="Select all matching files"></th>
            <th class="name" data-sort="name"><button type="button">Name<svg class="icon sort"><use href="#i-sort"/></svg></button></th>
            <th class="when" data-sort="modified"><button type="button">Modified<svg class="icon sort"><use href="#i-sort"/></svg></button></th>
            <th class="size" data-sort="bytes"><button type="button">Size<svg class="icon sort"><use href="#i-sort"/></svg></button></th>
          </tr>
        </thead>
        <tbody id="filebody"></tbody>
      </table>
      <div id="empty" class="empty">
        <svg class="icon" id="empty-icon"><use href="#i-files"/></svg>
        <strong id="empty-title"></strong>
        <span id="empty-text"></span>
        <button type="button" class="btn primary" id="empty-action" hidden></button>
      </div>
    </div>
    <footer class="bar foot">
      <span id="selectioncount" class="meta">No files selected</span>
      <button type="button" class="btn small quiet" id="clearselection" title="Clear selection (Esc)" hidden>Clear</button>
      <button type="button" class="btn small danger-outline" id="review-selection" disabled><svg class="icon"><use id="review-icon" href="#i-trash"/></svg><span id="review-label">Move to Trash…</span></button>
      <span class="grow"></span>
      <span id="pageno" class="meta"></span>
      <button type="button" class="btn small square" id="prevpage" aria-label="Previous page" title="Previous page"><svg class="icon"><use href="#i-prev"/></svg></button>
      <button type="button" class="btn small square" id="nextpage" aria-label="Next page" title="Next page"><svg class="icon"><use href="#i-next"/></svg></button>
    </footer>
  </section>

  <!-- The native ChatGPT WebView is laid over #browser-host; its rectangle is reported to Rust. -->
  <section id="browser" aria-label="ChatGPT browser">
    <header class="bar browser-bar">
      <button type="button" class="btn small quiet" data-command="home"><svg class="icon"><use href="#i-home"/></svg>ChatGPT</button>
      <button type="button" class="btn small quiet" data-command="space"><svg class="icon"><use href="#i-library"/></svg>Library</button>
      <button type="button" class="btn small quiet" data-command="refresh"><svg class="icon"><use href="#i-refresh"/></svg>Reload</button>
      <span class="grow"></span>
      <span class="meta">Sign in here once. This app remembers you on this computer.</span>
    </header>
    <div id="browser-host"></div>
  </section>

  <section id="evidence" aria-labelledby="evidence-title">
    <header class="bar">
      <div class="title"><h1 id="evidence-title">Diagnostics</h1><span class="meta">Connection details to help find and fix problems</span></div>
      <span class="grow"></span>
      <label class="switch"><input id="capture" type="checkbox">Record troubleshooting details</label>
      <button type="button" class="btn" id="save" disabled>Save report</button>
      <button type="button" class="btn quiet" id="clearevidence">Clear</button>
    </header>
    <div class="evidence">
      <div id="list" class="evidence-list"></div>
      <pre id="detail"></pre>
    </div>
  </section>
</main>

<dialog id="review-dialog" aria-labelledby="review-title">
  <h2 id="review-title"></h2>
  <p id="review-total"></p>
  <div id="review-files"></div>
  <p id="review-note"></p>
  <div class="dialog-actions">
    <button type="button" class="btn" id="review-cancel">Cancel</button>
    <button type="button" class="btn primary" id="review-confirm"></button>
  </div>
</dialog>

<script>
// Commands are requests, not authority; Rust validates IDs, review nonces, and state.
function send(command){window.ipc.postMessage(command)}
/*INVENTORY_SCRIPT*/
// Smoke tests require this signal, so script initialization errors fail startup validation.
send('__ready');
</script>
</body>
</html>
